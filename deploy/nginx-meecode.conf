# 觅码线上站点配置（最终形态）
# 使用方式见 docs/deploy-runbook.md 第 5/7 步：先装 80 端口最小配置签证书，
# 再替换为本文件并 reload。部署前把 <你的域名> 全部替换为实际域名。
server {
    listen 80;
    server_name <你的域名>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <你的域名>;

    ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;

    root /var/www/meecode;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # 安全响应头（安全基线 2026-09-21；always = 错误响应也带头）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：无 CDN 外链（已 grep 确认）；img 放行 https:（README 用户内容图片）
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; img-src 'self' data: https:; media-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /explain-api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须补：本 location 出现任一 proxy_set_header 后，nginx 默认的
        # X-Forwarded-For 即被清空；缺此行解读域流量在后端全共享 127.0.0.1，
        # 匿名 LLM 限流退化成全局一桶（误伤 + 失效）。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 信息流后端(与解读同进程,端口 8100;/api 无 rewrite,后端本身就挂在 /api 下)
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
