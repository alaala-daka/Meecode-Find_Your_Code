# 觅码线上站点配置（最终形态）
# 使用方式见 docs/deploy-runbook.md 第 5/7 步：先装 80 端口最小配置签证书，
# 再替换为本文件并 reload。部署前把 <你的域名> 全部替换为实际域名。
server {
    listen 80;
    server_name <你的域名>;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <你的域名>;

    ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;

    root /var/www/meecode;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # 安全响应头收敛于 snippet（单一事实源，防 server/location 两处字面量漂移）。
    # 安装：cp deploy/nginx-security-headers.conf /etc/nginx/snippets/
    # 修改头字段只改 snippet；冒烟断言 7 头齐全（runbook §14）。
    include snippets/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 裸 /admin 归一（location /admin/ 带尾斜杠前缀不匹配 /admin；
    # 不归一会落 location / 回主站 index）。301 后由下块接管并过 Basic Auth。
    location = /admin {
        return 301 /admin/;
    }

    # 管理台 SPA（root 形态：产物放 /var/www/admin/；CSP 复用全局头不放宽）
    # root+try_files 为主形态，规避 alias+try_files 在部分 nginx 版本的
    # 深链接刷新/资产路径错乱（nginx 官方 FAQ 已知坑）。
    #
    # 双凭证门（spec F9）：Basic Auth 挡匿名下载 SPA 外壳/JS bundle；
    # 作用域仅 /admin/（RFC 7617 凭证作用域=挑战目录），/api/admin/ 不带
    # Basic，API 边界仍是后端 require_admin。凭证文件 htpasswd -cB 建
    # （bcrypt，runbook §14）；浏览器按 realm 缓存，每会话只输一次。
    location /admin/ {
        auth_basic "Meecode Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-admin;

        # 不收录（robots.txt Disallow 仅劝阻合规爬虫，权威靠本头）
        add_header X-Robots-Tag "noindex, nofollow" always;
        # 必须 include：location 出现 add_header 后不再继承 server 级头，
        # 漏此行会把 CSP/HSTS 等在 /admin/ 下剥光（比不加固更糟）。
        include snippets/security-headers.conf;

        root /var/www;   # 产物放 /var/www/admin/
        try_files $uri $uri/ /admin/index.html;
        # 备选 alias 形态（产物放 /var/www/meecode-admin/）；仅当 root 形态
        # 不可用时启用，深链接/资产冒烟必须重跑：
        # alias /var/www/meecode-admin/;
        # try_files $uri $uri/ /admin/index.html;
    }

    location /explain-api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须补：本 location 出现任一 proxy_set_header 后，nginx 默认的
        # X-Forwarded-For 即被清空；缺此行解读域流量在后端全共享 127.0.0.1，
        # 匿名 LLM 限流退化成全局一桶（误伤 + 失效）。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 信息流后端(与解读同进程,端口 8100;/api 无 rewrite,后端本身就挂在 /api 下)
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
