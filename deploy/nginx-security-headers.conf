# 觅码安全响应头（单一事实源）
# 安装位置：/etc/nginx/snippets/security-headers.conf
# server 级与 location /admin/ 共同 include——禁止在两处各自复制字面量
# （nginx 坑：location 内出现任一 add_header 即不再继承 server 级头，漏 include 会剥光安全头）。
# 修改头字段只改本文件；冒烟须断言 7 头齐全（runbook §14）。
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# CSP：无 CDN 外链；img 放行 https:（README 用户内容图片）
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; img-src 'self' data: https:; media-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
